<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QuickCart - Shop</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===================== HEADER ===================== -->
<header class="site-header">
<a href="index.html" class="logo">
<svg class="logo-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<path d="M4 20h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<path d="M2 28h18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<path d="M4 36h12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<path d="M24 18l-6-10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<path d="M24 18h30l-6 26H28z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
<circle cx="32" cy="54" r="5" fill="currentColor"/>
<circle cx="48" cy="54" r="5" fill="currentColor"/>
</svg>
<span>QuickCart</span>
</a>

<nav>
<a href="index.html" aria-current="page">Home</a>
<a href="#cart">Cart</a>
<a href="checkout.html">Checkout</a>
</nav>
</header>

<!-- ===================== HERO / BACKGROUND SECTION ===================== -->
<section class="hero">
<div class="hero-decor" aria-hidden="true"></div>
<div class="hero-content">
<h1>Shop the Collection</h1>
<p class="hero-subtitle">A few considered pieces, delivered across the UAE.</p>
</div>
</section>

<main>

<!-- ===================== PRODUCT SECTION ===================== -->
<section id="products" class="card products-section">
<h2>Our Products</h2>

<div class="product-grid">

<article class="product-card">
<div class="product-image">
<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M12 34v-4a20 20 0 0 1 40 0v4" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<rect x="8" y="32" width="10" height="16" rx="4" fill="currentColor" opacity="0.85"/>
<rect x="46" y="32" width="10" height="16" rx="4" fill="currentColor" opacity="0.85"/>
</svg>
</div>
<h3>Wireless Headphones</h3>
<p class="price">AED 299</p>
<button class="add-to-cart-btn" data-product="Wireless Headphones" data-price="299">Add to Cart</button>
</article>

<article class="product-card">
<div class="product-image">
<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect x="20" y="4" width="24" height="10" rx="2" fill="currentColor" opacity="0.5"/>
<rect x="20" y="50" width="24" height="10" rx="2" fill="currentColor" opacity="0.5"/>
<rect x="16" y="14" width="32" height="36" rx="8" stroke="currentColor" stroke-width="3"/>
<circle cx="32" cy="32" r="2.5" fill="currentColor"/>
<line x1="32" y1="32" x2="32" y2="24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="32" y1="32" x2="38" y2="35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>
</div>
<h3>Smart Watch</h3>
<p class="price">AED 450</p>
<button class="add-to-cart-btn" data-product="Smart Watch" data-price="450">Add to Cart</button>
</article>

<article class="product-card">
<div class="product-image">
<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M22 22V16a10 10 0 0 1 20 0v6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<rect x="12" y="22" width="40" height="32" rx="4" stroke="currentColor" stroke-width="3"/>
<line x1="12" y1="34" x2="52" y2="34" stroke="currentColor" stroke-width="2" opacity="0.5"/>
</svg>
</div>
<h3>Leather Bag</h3>
<p class="price">AED 199</p>
<button class="add-to-cart-btn" data-product="Leather Bag" data-price="199">Add to Cart</button>
</article>

</div>
</section>

<!-- ===================== CART SECTION ===================== -->
<section id="cart" class="card">
<h2>Cart</h2>
<p id="cartCount">Cart: 0 items</p>
<p id="cartTotal">Total: AED 0</p>
<p id="cartMessage" class="status-message" aria-live="polite"></p>
</section>

<!-- ===================== DISCOUNT SECTION ===================== -->
<section id="discount" class="card">
<h2>Discount</h2>
<button id="applyDiscountBtn">Apply Discount</button>
<p id="discountMessage" class="status-message" aria-live="polite"></p>
</section>

<!-- ===================== GO TO CHECKOUT ===================== -->
<div class="checkout-cta">
<a href="checkout.html" class="checkout-cta-link">Go to Checkout</a>
</div>

</main>

<!-- ===================== "WHAT DID I MISS?" FEATURE ===================== -->
<button id="whatDidIMissBtn" aria-label="What did I miss? Get a spoken summary of recent changes">
🔊 What Did I Miss?
</button>

<div id="missedSummaryPanel" class="missed-panel hidden" aria-live="polite">
<div class="missed-panel-header">
<h3>What You Missed</h3>
<button id="closeMissedPanelBtn" aria-label="Close summary">✕</button>
</div>
<p id="missedSummaryText">Nothing yet.</p>
</div>

<script src="script.js"></script>
</body>
</html>
